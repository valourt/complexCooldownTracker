# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# This build's Loom version requires JDK 21 to run (the mod itself still
# targets Java 17 at runtime - see the "release = 17" line in build.gradle).
# Update this path if you reinstall/move your JDK 21.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/OpenJDK21U-jdk_x64_windows_hotspot_21.0.12.1_1/jdk-21.0.12.1+1

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.18.2
# NOTE: this build number is confirmed to exist (seen directly in Fabric's
# own Yarn mappings documentation). If it ever stops resolving, check
# https://fabricmc.net/develop for the current 1.18.2 build number.
yarn_mappings=1.18.2+build.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.2.3
group=com.tomcraft

# Dependencies
fabric_api_version=0.77.0+1.18.2
