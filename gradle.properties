# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Loom (this build's Gradle plugin, "-remap" required since 1.18.2 is
# an obfuscated Minecraft version) genuinely requires JDK 21 to run the
# plugin itself, ever since Loom 1.11 - independent of what Java version
# the MOD ITSELF compiles to (still Java 17, see "release = 17" in
# build.gradle). This is a real, deliberate requirement, not a mistake -
# don't change this back to JDK 17 even if a future error message seems to
# suggest it; check the actual Loom version's own requirements first.
# Update this path if you reinstall/move your JDK 21.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/OpenJDK21U-jdk_x64_windows_hotspot_21.0.12.1_1/jdk-21.0.12.1+1

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.18.2
# NOTE: this build number is confirmed to exist (seen directly in Fabric's
# own Yarn mappings documentation). If it ever stops resolving, check
# https://fabricmc.net/develop for the current 1.18.2 build number.
yarn_mappings=1.18.2+build.1
loader_version=0.19.3
# Pinned to a specific stable patch release (confirmed to actually exist on
# maven.fabricmc.net), not the bare "1.17" GitHub release tag - that tag
# name isn't itself a resolvable Maven artifact version; published patch
# releases under it look like 1.17.0, 1.17.4, 1.17.18, etc. If this ever
# stops resolving, check https://maven.fabricmc.net/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/
# for the current latest patch under the 1.17.x line.
loom_version=1.17.18

# Mod Properties
version=1.3.0
group=com.tomcraft

# Dependencies
fabric_api_version=0.77.0+1.18.2
